{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>ctndrd|{% block title %} {% endblock %}</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <style>
        body{
            background-color: #f4f6fc;
        }
        header{
            position: fixed;
            width: 99%;
        }
        .navbar{
            background-color: #050a30;
            width: 100%;
            position: fixed;
            display: block;
            top: 0px;
            left: 0px;
            border-radius: 1px;
        }
        .nav-content{
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 3px 5px;
        }
        .nav-content p,a{
            color: #f4f6fc;
            font-size: 25px;
        }
        .nav-content img{
            width: 11%;
            height: 11%;
            border-radius: 50%;
            border: 2px solid #f4f6fc;
        }
        .nav-content a:hover{
            color: rgb(48, 241, 248);
        }
        .nav-content img:hover{
            border: 2px solid rgb(48, 241, 248);
        }
        section{
            padding: 100px 20px 20px 20px;
            display: flex;
            flex-direction: column;
        }
        .notex{
            display: none;
        }
        .create-post-form{
            margin-top: -10px;
            margin-bottom: 5px;
            width: 100%;
            display: flex;
            justify-content: space-between;
        }
        .input-img{
            width: 90%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: white;
        }
        .input-img textarea{
            width: 90%;
            border: none;
            outline: none;
            border-radius: 5px;
            padding: 10px 0 10px 2px;
        }
        .input-img textarea::placeholder{
            font-family: sans-serif;
            font-size: 10px;
            color: #050a30;
            text-align: center;
        }
        .lst{
            width: 10%;
        }
        .create-post-form button{
            font-family: sans-serif;
            font-size: 12px;
            border: none;
            border-radius: 5px;
            background-color: rgb(48, 241, 248);
            color: #050a30;
        }
        .post{
            margin-bottom: 10px;
        }
        .post-head{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .post-head img{
            width: 45px;
            height: 45px;
            border-radius: 50%;
        }
        .post-head-bio{
            margin-left: -15%;
            width: 60%;
        }
        .post-head-bio h4{
            font-size: 13px;
            font-family: sans-serif;
        }
        .post-head-bio p{
            font-size: 10px;
            margin-top: -15px;
            font-family: sans-serif;
        }
        .post-image img{
            background-color: #050a30;
            border: none;
            outline: none;
            width: 100%;
            object-fit: cover;
            border-radius: 8px;
        }
        .post-actions{
            margin-top: -20px;
            display: flex;
            padding: 0 8px;
            align-items: center;
            justify-content: space-between;
        }
        .post-actions p{
            font-size: 25px;
            color: #050a30;
        }
        .action{
            display: flex;
            align-items: center;
            width: 30%;
            justify-content: space-between;
        }
        .action img{
            height: 24px;
        }
        .likes-comments{
            display: flex;
            gap: 10px;
            margin-top: -20px;
        }
        .profile-pics img{
            height: 25px;
            width: 25px;
            border: 2px solid #ebecf1;
            border-radius: 50%;
        }
        .profile-pics :nth-child(2){
            z-index: 1;
            margin-left: -18px;
        }
        .profile-pics :nth-child(3){
            z-index: 2;
            margin-left: -18px;
        }
        .likcom{
            display: flex;
            margin-top: -10px;
            gap: 10px;
            font-family: sans-serif;
            font-size: 14px;
        }
        .likcom span{
            font-size: 18px;
            margin-right: 5px;
            font-weight: 600;
            color: #050a30;
        }
        .post-message{
            background-color: #ebecf1;
            border-radius: 10px;
            padding-left: 5px;
            padding-top: 5px;
        }
        .post-message h4{
            font-family: sans-serif;
            font-size: 14px;
            margin-top: -1px;
        }
        .post-message p{
            font-family: sans-serif;
            margin-top: -15px;
            font-size: 12px;
            height: 30px;
            overflow-y: auto;
        }
        .comments{ 
            margin-top: -5px;
            border: 3px solid white;
            padding: 5px;
            border-radius: 12px;
        }
        .comm{
            height: 212px;
            overflow-y: auto;
        }
        .sub-comment{
            display: flex;
            border-radius: 12px;
            gap: 5px;
            background-color: #ebecf1;
            margin-bottom: 5px;
        }
        .sub-comment img{
            width: 30px;
            background-color: #050a30;
            margin-top: 20px;
            border: none;
            height: 30px;
            border-radius: 50%;
        }
        .post-messages{
            border-radius: 12px;
            padding: 0 5px;
        }
        .post-messages h4{
            font-family: sans-serif;
            font-size: 15px;
        }
        .pes{
            display: flex;
            flex-direction: column;
            margin-top: -20px;
        }
        .pes p{
            font-family: sans-serif;
            font-size: 12px;
            margin-top: 0px;
        }
        .post-a-comment form{
            display: flex;
            margin-top: 10px;
            justify-content: space-between;
            align-items: center;
        }
        .post-a-comment form input{
            width: 70%;
            border: none;
            outline: none;
            background-color: white;
            border-radius: 12px;
            height: 40px;
            color: #050a30;
            font-family: sans-serif;
            font-size: 12px;
        }
        .post-a-comment form button{
            width: 23%;
            border: none;
            border-radius: 8px;
            background-color: rgb(48, 241, 248);
            height: 40px;
            color: #050a30;
            font-family: sans-serif;
            font-size: 12px;
        }
        footer{
            position: fixed;
            bottom: 0px;
            left: 0px;
            right: 0px;
            background-color: #f4f6fc;
            height: 30px;
            width: 100%;
        }
        .foot{
            display: flex;
            width: 100%;
            padding: 2px 20px;
            margin-top: -3px;
            gap: 45%;
        }
        .foot button{
            width: 80px;
            font-size: 12px;
            font-family: sans-serif;
            background-color: #050a30;
            color: #f4f6fc;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            margin-top: -5px;
        }
        .foot button:hover{
            color: rgb(48, 241, 248);
        }

        @media screen and (min-width: 500px) {
        .header{
            display: none;
        }
        .post{
            display: none;
        }
        .notex{
            display: block;
            font-family: sans-serif;
        }
        .notex-img{
            width: 170px;
            height: 170px;
            border-radius: 50%;
        }
        .footer{
            display: none;
        }
        .create-post{
            display: none;
        }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="nav-content">
                <img id="homepage" src="{% static 'img/ctndrd4.png' %}" alt="home">
                <p><a href="{% url 'shop' %}"><i class='bx  bx-store'  ></i> </a></p>
                <p><a href="{% url 'music' %}"><i class='bx  bx-music'  ></i> </a></p>
                <p><a href="{% url 'hostel' %}"><i class='bx  bx-building-house'  ></i> </a></p>
                <p><a href="{% url 'movie' %}"><i class='bx  bx-movie-play'  ></i> </a></p>
                <p><a href="{% url 'messages' %}"><i class='bx  bx-message-dots'  ></i> </a></p>
                <p><a href="{% url 'account-settings' %}"><i class='bx  bx-cog'  ></i> </a></p>
                {% if request.user.profile.profile_pic %}
                    <img id="profilepage" src="{{ request.user.profile.profile_pic.url }}" alt="profilepic">
                {% else %}
                    <img id="profilepage" src="{% static 'img/user_avatar.jpg' %}" alt="profilepic">
                {% endif %}
            </div>
        </nav>
    </header>
    {% block content %}
    {% endblock %}

    <script>
        // for home and profile buttons
        document.addEventListener('DOMContentLoaded', () => {
            const homepageImg = document.getElementById('homepage');
            const profilepageImg = document.getElementById('profilepage');

            homepageImg.addEventListener('click', () => {
                window.location.href = "{% url 'hom' %}"; // Adjust URL as needed
            });

            profilepageImg.addEventListener('click', () => {
                window.location.href = "{% url 'profile' %}"; // Adjust URL as needed
            });
        });

    </script>
</body>
</html>
